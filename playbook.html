<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laminar Pipeline</title>
<link rel="icon" type="image/png" href="images/Laminar_pipeline_logo.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="wrap" id="root">

  <a class="back-link" href="index.html">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12L6 8l4-4"/></svg>
    Laminar Pipeline
  </a>

  <div class="eyebrow" id="playbookType">Deployment Playbook</div>
  <h1 class="page-title" id="playbookName">Loading…</h1>
  <p class="page-desc" id="playbookDesc"></p>

  <!-- Client / project bar -->
  <div class="client-bar">
    <span class="bar-label">Client</span>
    <div class="select-wrap">
      <select class="app-select" id="projectSelect"></select>
    </div>
    <div class="bar-actions">
      <button class="btn btn-primary" id="btnNew">+ New</button>
      <button class="btn btn-ghost"   id="btnRename">Rename</button>
      <button class="btn btn-ghost"   id="btnExport">Internal Report</button>
      <button class="btn btn-ghost"   id="btnClientReport">Client Report</button>
      <button class="btn btn-danger"  id="btnDelete">Delete</button>
    </div>
    <div class="autosave-group" id="autoSaveGroup">
      <button class="autosave-btn" id="btnAutoSaveConnect" title="Connect an existing laminar-data.json file">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 11v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2"/><polyline points="10.5 5.5 8 3 5.5 5.5"/><line x1="8" y1="3" x2="8" y2="10"/></svg>
        Connect file
      </button>
      <button class="autosave-btn autosave-btn--new" id="btnAutoSaveNew" title="Create a new laminar-data.json backup file">New file</button>
      <button class="autosave-btn autosave-btn--reconnect" id="btnAutoSaveReconnect" style="display:none" title="Re-grant file access for auto-save">↺ Reconnect</button>
      <button class="autosave-btn autosave-btn--on" id="btnAutoSaveOn" style="display:none" title="Auto-save active — click to disconnect">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 11v2a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-2"/><polyline points="10.5 5.5 8 3 5.5 5.5"/><line x1="8" y1="3" x2="8" y2="10"/></svg>
        <span id="autoSaveLabel">Auto-saving ✓</span>
      </button>
    </div>
  </div>

  <!-- Summary card -->
  <div class="summary-card" id="summaryCard" style="display:none">
    <div class="summary-top">
      <span class="bar-label">Progress</span>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="totalBar"></div></div>
      <span class="progress-count" id="totalCount">0 / 0</span>
      <button class="reset-btn" id="btnReset">Reset</button>
    </div>
    <div class="summary-chips">
      <span class="chip" id="chipPhase"></span>
      <span class="chip warn hidden" id="chipActions"></span>
      <span class="chip warn hidden" id="chipAssets"></span>
      <span class="chip hidden" id="chipQual"></span>
    </div>
  </div>

  <!-- Empty state -->
  <div class="empty-state" id="emptyState">
    <div class="empty-title">No projects yet</div>
    <div class="empty-desc">Add your first client project to begin tracking delivery.</div>
    <button class="btn btn-primary" id="btnNewEmpty" style="padding:10px 20px;font-size:13px">+ New Project</button>
  </div>

  <!-- Tab navigation + section panels -->
  <div id="mainContent" style="display:none">
    <nav class="tab-nav" id="tabNav">
      <button class="tab-btn active" data-tab="phases">Phases</button>
      <button class="tab-btn" data-tab="qualification">Qualification</button>
      <button class="tab-btn" data-tab="assets">Assets</button>
      <button class="tab-btn" data-tab="deliverables">Deliverables</button>
      <button class="tab-btn" data-tab="training">Training</button>
    </nav>
    <div class="tab-content active" id="tab-phases"></div>
    <div class="tab-content" id="tab-qualification"></div>
    <div class="tab-content" id="tab-assets"></div>
    <div class="tab-content" id="tab-deliverables"></div>
    <div class="tab-content" id="tab-training"></div>
    <div class="tab-content" id="tab-cycles"></div>
  </div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="UI.modalBgClick(event)">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-title" id="modal-title"></div>
    <div class="modal-msg"   id="modal-msg"></div>
    <input class="modal-input" id="modal-input" type="text" autocomplete="off" onkeydown="UI.modalKey(event)">
    <div class="modal-error" id="modal-error"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="UI.closeModal()">Cancel</button>
      <button class="btn btn-primary" id="modal-confirm" onclick="UI.modalSubmit()">Confirm</button>
    </div>
  </div>
</div>

<script type="module">
import { getPlaybook }          from './playbooks/registry.js';
import { escHtml, openModal, closeModal, modalBgClick, modalKey, modalSubmit } from './js/ui.js';
import {
  migrateIfNeeded, loadState, saveState,
  getActiveProjectId, setActiveProjectId, getProject,
  listProjects, createProject, renameProject, deleteProject,
  resetProjectTasks, mutateProject,
  getAutoSaveHandle, setAutoSaveHandle, clearAutoSaveHandle, setAutoSaveListener,
} from './js/storage.js';
import * as Engine from './js/engine.js';


// Expose modal helpers to inline handlers
window.UI = { modalBgClick, modalKey, modalSubmit, closeModal };

// ── Module state (must be declared before boot() is called) ──────────────────

let _currentProjectId = null;
let _renderedTabs     = new Set();

// ── Bootstrap ────────────────────────────────────────────────────────────────

migrateIfNeeded();

const params     = new URLSearchParams(location.search);
const playbookId = params.get('playbook');
const playbook   = getPlaybook(playbookId);

if (!playbook) {
  document.getElementById('playbookName').textContent = 'Playbook not found.';
  document.getElementById('playbookDesc').textContent = `No playbook registered with ID "${playbookId}".`;
} else {
  boot(playbook);
}

function boot(pb) {
  // Update page metadata
  document.title = pb.name + ' — Laminar Pipeline';
  document.getElementById('playbookType').textContent = pb.type.charAt(0).toUpperCase() + pb.type.slice(1) + ' Playbook';
  document.getElementById('playbookName').textContent = pb.name;
  document.getElementById('playbookDesc').textContent = pb.description;

  // Init engine
  Engine.init(pb, null, onUpdate);

  // Add cycles tab for retainer playbooks
  if (pb.type === 'retainer') {
    const nav = document.getElementById('tabNav');
    const btn = document.createElement('button');
    btn.className = 'tab-btn';
    btn.dataset.tab = 'cycles';
    btn.textContent = 'Operating Cycles';
    nav.appendChild(btn);
  }

  // Wire up tab switching
  document.getElementById('tabNav').addEventListener('click', e => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    switchTab(btn.dataset.tab);
  });

  // Wire up project bar buttons
  document.getElementById('btnNew').onclick      = () => newProject();
  document.getElementById('btnNewEmpty').onclick  = () => newProject();
  document.getElementById('btnRename').onclick    = () => renameCurrentProject();
  document.getElementById('btnDelete').onclick    = () => deleteCurrentProject();
  document.getElementById('btnExport').onclick       = () => Engine.exportSnapshot();
  document.getElementById('btnClientReport').onclick = () => Engine.exportClientReport();
  document.getElementById('btnAutoSaveConnect').onclick   = () => autoSaveConnect();
  document.getElementById('btnAutoSaveNew').onclick      = () => autoSaveNew();
  document.getElementById('btnAutoSaveReconnect').onclick = () => autoSaveReconnect();
  document.getElementById('btnAutoSaveOn').onclick       = () => autoSaveDisconnect();
  setAutoSaveListener(result => {
    const t = result.at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (result.ok) {
      _setAutoSaveUI('on', 'Saved · ' + t);
    } else {
      console.error('[Laminar] Auto-save write error:', result.error);
      _setAutoSaveUI('error', '⚠ Save failed · ' + t);
    }
  });
  _tryReconnectAutoSave();
  document.getElementById('btnReset').onclick     = () => resetCurrent();
  document.getElementById('projectSelect').onchange = e => switchProject(e.target.value);

  // Load initial project
  const projects = listProjects(pb.id);
  if (projects.length) {
    const savedActive = getActiveProjectId(pb.id);
    const active      = projects.find(p => p.id === savedActive) || projects[0];
    showUI(true);
    refreshProjectSelect(active.id);
    switchProject(active.id, true);
  } else {
    showUI(false);
  }
}

// ── Project switching ─────────────────────────────────────────────────────────

function switchProject(projectId, skipSelectRefresh) {
  _currentProjectId = projectId;
  _renderedTabs = new Set();
  Engine.setProject(projectId);
  setActiveProjectId(playbookId, projectId);
  if (!skipSelectRefresh) refreshProjectSelect(projectId);
  document.getElementById('summaryCard').style.display = 'block';
  // Render active tab (always start on phases)
  const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'phases';
  renderTab(activeTab);
  onUpdate();
}

function refreshProjectSelect(activeId) {
  const sel      = document.getElementById('projectSelect');
  const projects = listProjects(playbookId);
  sel.innerHTML  = projects.map(p =>
    `<option value="${escHtml(p.id)}" ${p.id === activeId ? 'selected' : ''}>${escHtml(p.clientName)}</option>`
  ).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-' + tab));
  if (!_renderedTabs.has(tab)) renderTab(tab);
}

function renderTab(tab) {
  const container = document.getElementById('tab-' + tab);
  if (!container) return;
  container.innerHTML = '';
  try {
    Engine.renderSection(tab, container);
  } catch (err) {
    container.innerHTML = `<div style="padding:20px;color:#F87171;font-family:monospace;font-size:12px;white-space:pre-wrap">Render error in "${tab}" tab:\n${err.message}\n\n${err.stack || ''}</div>`;
  }
  _renderedTabs.add(tab);
}

// ── Summary update ────────────────────────────────────────────────────────────

function onUpdate() {
  const progress = Engine.getProgress();
  if (progress.total === 0) console.warn('[Laminar] getProgress returned 0 total — _projectId may be unset or project missing from storage');
  const { done, total, pct, currentPhase, clientActions } = progress;
  const missingAssets = Engine.getMissingAssetCount();
  const qualProg      = Engine.getQualProgress();

  const bar   = document.getElementById('totalBar');
  const count = document.getElementById('totalCount');
  if (bar)   bar.style.width    = pct + '%';
  if (count) count.textContent  = `${done} / ${total}`;

  setChip('chipPhase',   currentPhase ? `${currentPhase.tag} — ${currentPhase.title}` : '', '');
  setChip('chipActions', clientActions > 0 ? `${clientActions} client action${clientActions !== 1 ? 's' : ''} outstanding` : '', 'warn');
  setChip('chipAssets',  missingAssets > 0 ? `${missingAssets} required asset${missingAssets !== 1 ? 's' : ''} missing` : '', 'warn');
  setChip('chipQual',    qualProg ? `${qualProg.done}/${qualProg.total} qualified` : '', qualProg?.done === qualProg?.total ? 'good' : '');

  // Update action tab badge
  const actionBadge = document.querySelector('[data-tab="phases"] .tab-badge');
  if (actionBadge) { actionBadge.textContent = clientActions; actionBadge.classList.toggle('show', clientActions > 0); }
}

function setChip(id, text, cls) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'chip' + (cls ? ' ' + cls : '') + (text ? '' : ' hidden');
}

// ── Project CRUD ──────────────────────────────────────────────────────────────

function newProject() {
  openModal({
    title: 'New Project', placeholder: 'Client name…', confirmLabel: 'Create',
    callback: name => {
      const projects = listProjects(playbookId);
      if (projects.find(p => p.clientName === name)) {
        openModal({ title: 'Name taken', msg: `"${name}" already exists.`, mode: 'confirm', confirmLabel: 'OK', confirmClass: 'btn-ghost', callback: () => {} });
        return;
      }
      const id = createProject(name, playbookId);
      showUI(true);
      refreshProjectSelect(id);
      switchProject(id, true);
    }
  });
}

function renameCurrentProject() {
  if (!_currentProjectId) return;
  const project = getProject(_currentProjectId);
  openModal({
    title: 'Rename Project', msg: `Current name: "${project?.clientName}"`,
    placeholder: 'New name…', confirmLabel: 'Rename',
    callback: name => {
      renameProject(_currentProjectId, name);
      refreshProjectSelect(_currentProjectId);
    }
  });
}

function deleteCurrentProject() {
  if (!_currentProjectId) return;
  const project = getProject(_currentProjectId);
  openModal({
    title: 'Delete Project', mode: 'confirm', confirmLabel: 'Delete', confirmClass: 'btn-danger',
    msg: `Delete "${project?.clientName}" and all their data? This cannot be undone.`,
    callback: () => {
      const nextId = deleteProject(_currentProjectId);
      const remaining = listProjects(playbookId);
      if (remaining.length && nextId) {
        refreshProjectSelect(nextId);
        switchProject(nextId, true);
      } else {
        showUI(false);
      }
    }
  });
}

function resetCurrent() {
  if (!_currentProjectId) return;
  const project = getProject(_currentProjectId);
  openModal({
    title: 'Reset Progress', mode: 'confirm', confirmLabel: 'Reset', confirmClass: 'btn-danger',
    msg: `Reset all task checkboxes for "${project?.clientName}"? Notes and N/A settings will be kept.`,
    callback: () => {
      resetProjectTasks(_currentProjectId);
      _renderedTabs = new Set();
      renderTab(document.querySelector('.tab-btn.active')?.dataset.tab || 'phases');
      onUpdate();
    }
  });
}

function showUI(hasProjects) {
  document.getElementById('emptyState').style.display   = hasProjects ? 'none'  : 'block';
  document.getElementById('mainContent').style.display  = hasProjects ? 'block' : 'none';
  document.getElementById('summaryCard').style.display  = hasProjects ? 'block' : 'none';
}

// ── Auto-save (File System Access API + IndexedDB persistence) ───────────────
// File handles can't survive page navigation in JS memory alone.
// We store the handle in IndexedDB so it can be retrieved on every page load.
// Within the same browser session permission stays 'granted' — silent reconnect.
// After a full browser restart permission drops to 'prompt' — show Reconnect btn.

const _IDB_NAME  = 'laminar-autosave';
const _IDB_STORE = 'handles';
const _IDB_KEY   = 'autoSaveHandle';

function _idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(_IDB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(_IDB_STORE);
    req.onsuccess = e => res(e.target.result);
    req.onerror   = () => rej(req.error);
  });
}
async function _idbSave(handle) {
  const db = await _idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(_IDB_STORE, 'readwrite');
    tx.objectStore(_IDB_STORE).put(handle, _IDB_KEY);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function _idbLoad() {
  const db = await _idbOpen();
  return new Promise((res, rej) => {
    const tx  = db.transaction(_IDB_STORE, 'readonly');
    const req = tx.objectStore(_IDB_STORE).get(_IDB_KEY);
    req.onsuccess = () => res(req.result || null);
    req.onerror   = () => rej(req.error);
  });
}
async function _idbClear() {
  const db = await _idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction(_IDB_STORE, 'readwrite');
    tx.objectStore(_IDB_STORE).delete(_IDB_KEY);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}

// state: 'off' | 'on' | 'reconnect' | 'error'
function _setAutoSaveUI(state, label) {
  document.getElementById('btnAutoSaveConnect').style.display   = state === 'off' ? '' : 'none';
  document.getElementById('btnAutoSaveNew').style.display       = state === 'off' ? '' : 'none';
  document.getElementById('btnAutoSaveReconnect').style.display = state === 'reconnect' ? '' : 'none';
  const onBtn = document.getElementById('btnAutoSaveOn');
  onBtn.style.display = (state === 'on' || state === 'error') ? '' : 'none';
  onBtn.classList.toggle('autosave-btn--error', state === 'error');
  const lbl = label ?? (state === 'error' ? '⚠ Save failed' : 'Auto-saving ✓');
  document.getElementById('autoSaveLabel').textContent = lbl;
}

function _noFileApi() {
  alert('Auto-save requires Chrome or Edge.\n\nUse "Download Backup" / "Restore from File" on the Laminar Pipeline dashboard instead.');
}

async function _tryReconnectAutoSave() {
  if (!('showOpenFilePicker' in window)) return;
  try {
    const handle = await _idbLoad();
    if (!handle) return;
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      setAutoSaveHandle(handle);
      _setAutoSaveUI('on');
    } else {
      // Permission needs re-granting (new browser session) — show Reconnect btn
      _setAutoSaveUI('reconnect');
    }
  } catch (e) {
    console.warn('[Laminar] Auto-save reconnect failed:', e);
  }
}

async function autoSaveConnect() {
  if (!window.showOpenFilePicker) { _noFileApi(); return; }
  let handle;
  try {
    [handle] = await window.showOpenFilePicker({
      types: [{ description: 'Laminar Backup', accept: { 'application/json': ['.json'] } }],
      multiple: false, mode: 'readwrite',
    });
  } catch (e) { if (e.name !== 'AbortError') console.error(e); return; }
  // Connect for auto-save writes only — never load from the file here.
  // To restore data from a file use "Restore from File" on the dashboard.
  await _idbSave(handle);
  setAutoSaveHandle(handle);
  _setAutoSaveUI('on');
  saveState(loadState());  // first write confirms the handle is live
}

async function autoSaveNew() {
  if (!window.showSaveFilePicker) { _noFileApi(); return; }
  let handle;
  try {
    handle = await window.showSaveFilePicker({
      types: [{ description: 'Laminar Backup', accept: { 'application/json': ['.json'] } }],
      suggestedName: 'laminar-data.json',
    });
  } catch (e) { if (e.name !== 'AbortError') console.error(e); return; }

  await _idbSave(handle);
  setAutoSaveHandle(handle);
  _setAutoSaveUI('on');
  saveState(loadState());
}

async function autoSaveReconnect() {
  try {
    const handle = await _idbLoad();
    if (!handle) { _setAutoSaveUI('off'); return; }
    const perm = await handle.requestPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      setAutoSaveHandle(handle);
      _setAutoSaveUI('on');
    }
  } catch (e) { console.warn('[Laminar] Reconnect failed:', e); }
}

async function autoSaveDisconnect() {
  if (confirm('Disconnect auto-save? Your data stays in the browser and the backup file keeps its last saved state.')) {
    clearAutoSaveHandle();
    await _idbClear();
    _setAutoSaveUI('off');
  }
}
</script>

</body>
</html>
